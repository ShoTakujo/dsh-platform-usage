<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  :root{
    --bg:#f7f8fb; --card:#ffffff; --line:#e8e6e1; --text:#1f2328; --dim:#6b7280;
    /* 六档绿梯（亮色）：越用越多越深。按 OKLab 等距排的，相邻档 ΔE ≥0.08，13px 上也分得清 */
    --l0:#eceff1; --l1:#cdeab4; --l2:#a5dc8c; --l3:#6ec96a; --l4:#3fae52; --l5:#238b41; --l6:#14622f;
    --accent:#4d6bfe;
    /* 玻璃：卡片与浮层共用的乳白底 + 边框 */
    --glass:rgba(255,255,255,.58);
    --glass-strong:rgba(255,255,255,.76);
    --glass-line:rgba(255,255,255,.72);
    --glass-stroke:rgba(17,24,39,.07);
    --glass-shadow:0 6px 26px rgba(15,23,42,.09), 0 1px 3px rgba(15,23,42,.05);
  }
  /* 暗色变量抽成一份，两个入口共用：
       · 独立打开 → 跟随系统 prefers-color-scheme
       · 插件面板 → 靠 <html data-theme="dark"> 显式指定（DSH 的主题是应用内设置，
         不一定等于系统主题；早先只认媒体查询，就会出现「DSH 亮色、面板暗色」的错配） */
  :root[data-theme="dark"]{
    --bg:#16181c; --card:#242629; --line:#34383d; --text:#e8eaed; --dim:#9aa0a6;
    /* 六档绿梯（暗色）：越用越多越亮，OKLab 等距，相邻档 ΔE ≥0.08 */
    --l0:#2d3134; --l1:#14512f; --l2:#1e6b3d; --l3:#2a8a4a; --l4:#3cb45c; --l5:#57d873; --l6:#8bf59a;
    --glass:rgba(38,41,46,.55); --glass-strong:rgba(44,47,53,.78);
    --glass-line:rgba(255,255,255,.08); --glass-stroke:rgba(255,255,255,.10);
    --glass-shadow:0 8px 30px rgba(0,0,0,.42), 0 1px 3px rgba(0,0,0,.3);
  }
  /* 没被显式指定主题时（独立打开），跟随系统 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181c; --card:#242629; --line:#34383d; --text:#e8eaed; --dim:#9aa0a6;
      --l0:#2d3134; --l1:#14512f; --l2:#1e6b3d; --l3:#2a8a4a; --l4:#3cb45c; --l5:#57d873; --l6:#8bf59a;
      --glass:rgba(38,41,46,.55); --glass-strong:rgba(44,47,53,.78);
      --glass-line:rgba(255,255,255,.08); --glass-stroke:rgba(255,255,255,.10);
      --glass-shadow:0 8px 30px rgba(0,0,0,.42), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
  /* 不支援 backdrop-filter 时退化成实色，别让文字失去对比 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .card,.modes,#tip{background:var(--card) !important}
  }
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 22px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:19px;font-weight:650;margin:0}
  .headRight{display:flex;align-items:center;gap:10px}
  .sub{color:var(--dim);font-size:12.5px}
  .sub b{color:var(--text);font-weight:600}
  /* 视图切换 + 刷新 = 同一个胶囊：外框只有一层，靠分隔线分区 */
  .modes{display:flex;align-items:center;gap:2px;padding:3px;
         background:var(--glass);border:1px solid var(--glass-line);border-radius:11px;
         backdrop-filter:blur(16px) saturate(165%);-webkit-backdrop-filter:blur(16px) saturate(165%);
         box-shadow:var(--glass-shadow)}
  .modes button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;
                padding:5px 14px;border-radius:7px;cursor:pointer}
  .modes button.on{background:var(--accent);color:#fff}
  /* 只留图标的刷新键 */
  .modes .refresh{display:inline-flex;align-items:center;justify-content:center;
                  padding:5px 10px;margin-right:3px;color:var(--dim);
                  border-right:1px solid var(--line);border-radius:7px 0 0 7px;
                  transition:color .15s ease,background .15s ease,transform .12s ease}
  .modes .refresh svg{display:block}
  .modes .refresh:hover{color:var(--text);background:rgba(127,127,127,.08)}
  .modes .refresh:active{transform:scale(.92)}
  .modes .refresh[disabled]{opacity:.6;cursor:default}
  .modes .refresh.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes errPulse{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .modes .refresh.err{color:#d92d20;animation:errPulse .32s ease 2}
  .card{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;
        padding:18px 18px 14px;margin-top:16px;
        backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
        box-shadow:var(--glass-shadow)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .stat .k{color:var(--dim);font-size:12px}
  .stat .v{font-size:22px;font-weight:660;letter-spacing:-.4px;margin-top:2px}
  .stat .v small{font-size:13px;font-weight:500;color:var(--dim);margin-left:3px}
  .gridbox{overflow-x:auto;overflow-y:hidden;
           /* 内边距不是装饰：悬停会把格子放大到 1.55×、再描一圈 1.5px 的环，
              整个绘制范围比原格子外扩约 5.9px；而滚动容器的裁剪边就是它自己的 padding box。
              不留这点余量，最下面一行的放大环会被横向滚动条那一条切掉（2026-10-04 用户报的
              「格子边框边缘被裁」）。横向也留 6px，拉到最右时最后一列同样不被切。 */
           padding:0 6px 8px 0;
           /* 滚动条：轨道必须透明。UA 默认用系统 Canvas 色画轨道（暗色下纯黑、亮色下纯白），
              面板背景在壁纸模式下是透明的，于是这条固定底色会横在热力图下面很扎眼。
              滑块用中性半透明灰，压在深底/浅底/壁纸上都看得见、也不抢戏。 */
           scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.55) transparent}
  .gridbox::-webkit-scrollbar{height:10px;width:10px}
  .gridbox::-webkit-scrollbar-track,
  .gridbox::-webkit-scrollbar-corner{background:transparent}
  .gridbox::-webkit-scrollbar-thumb{background:rgba(127,127,127,.5);border-radius:6px}
  .gridbox::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,.72)}
  /* 月份轴：绝对定位，每个标签的 left = 列索引 × 17px（13 格子 + 4 间隙），
     和格子的几何完全一致。以前是一排 span（宽 14px、有文字的改 auto）+ gap:4px，
     每个单元 18px 而格子是 17px，53 列累计漂 53px，到 9 月能偏出 5 个格子。 */
  .months{position:relative;height:14px;margin:0 0 5px 27px}
  .months span{position:absolute;top:0;font-size:11px;color:var(--dim);white-space:nowrap}
  .gridrow{display:flex;align-items:flex-start}
  .wd{display:flex;flex-direction:column;gap:4px;width:27px;flex:0 0 27px}
  .wd span{height:13px;font-size:10px;color:var(--dim);line-height:13px}
  .cols{display:flex;gap:4px}
  .col{display:flex;flex-direction:column;gap:4px}
  .c{width:13px;height:13px;border-radius:3px;background:var(--l0)}
  .c[data-tip]{cursor:pointer}
  /* 六档：只有 l1..l6。以前这里有 l1..l4 + 一条 "l5 兜底成 l4" —— 档数一改就把 l5 压掉了，
     所以那条兜底已经删掉：现在 level() 恰好返回 0..6，越界不再可能（顶格返回 LV.length = 6）。 */
  .c.l1{background:var(--l1)} .c.l2{background:var(--l2)} .c.l3{background:var(--l3)}
  .c.l4{background:var(--l4)} .c.l5{background:var(--l5)} .c.l6{background:var(--l6)}
  /* 图例已按用户要求撤掉（"神秘一点"）：档位含义只靠悬停看。
     ⚠️ 但 .legend 的样式先留着 —— 运行时装资产那条路只换 CSS 不换 HTML，
     正在跑的旧客户端手里还有那份带图例的旧结构，样式删了它会散成一排裸色块。
     下一次重启后这份 HTML 就没人用了，届时可以连同这两条规则一起删。 */
  .legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;color:var(--dim);font-size:11.5px;margin-top:10px}
  .legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
  /* 热力图卡片：图例没了，底部留白跟着收上来（原来 14px 是给图例垫的），
     现在上下都是 18px（10px 卡片内边距 + 8px 网格容器内边距），视觉对称 */
  .gridcard{padding-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  /* 第一列是名字（API Key / 模型），长名字允许换行——数字列保持不换行对齐 */
  th:first-child,td:first-child{white-space:normal;overflow-wrap:anywhere}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:4px;background:var(--accent);opacity:.75;display:inline-block;vertical-align:middle}
  .two{display:grid;grid-template-columns:1fr;gap:16px}
  .two>*{min-width:0}          /* 允许子项收缩，别再顶破容器 */
  /* 两张拆分表**一律上下排**（先「按 API Key」，再「按模型」）。
     早先写的是 @media(min-width:900px) 时并排两列 —— 那个 900px 判的是**视口宽度**，
     而面板在 DSH 设置页里被塞进内容列（列宽比视口窄得多，七八百像素），媒体查询照样命中，
     于是两张表并排、右边那张被容器裁掉（2026-10-04 用户报的）。
     表格单元格是 white-space:nowrap，并排所需的最小宽度远大于内容列 ⇒ 只能上下排。
     （将来若真想在宽屏并排，正确做法是容器查询 @container，而不是媒体查询。） */
  h2{font-size:14px;font-weight:600;margin:0 0 10px}
  /* 悬浮提示：换成乳白玻璃（原来是一块纯黑） */
  #tip{position:fixed;z-index:99;pointer-events:none;font-size:12px;
       /* popover 进 top layer 时 UA 会塞进 inset:0 + margin:auto，得清掉 */
       inset:auto;margin:0;
       padding:9px 12px;border-radius:12px;opacity:0;transition:opacity .1s;max-width:300px;line-height:1.55;
       background:var(--glass-strong);color:var(--text);
       border:1px solid var(--glass-line);
       backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
       box-shadow:0 12px 34px rgba(15,23,42,.16), 0 2px 8px rgba(15,23,42,.08)}
  #tip b{font-weight:650}
  #tip.on{opacity:1}
  .note{color:var(--dim);font-size:12px;margin-top:12px}
  .note code{background:rgba(127,127,127,.14);padding:1px 5px;border-radius:4px}

  /* ---------- 动效（对标 Codex：草地逐列生长 + 数字滚动） ---------- */
  @keyframes cellIn{
    0%  {transform:scale(.35) translateY(3px);opacity:0;filter:brightness(1.7)}
    55% {transform:scale(1.1)  translateY(0);  opacity:1;filter:brightness(1.22)}
    100%{transform:scale(1)    translateY(0);  opacity:1;filter:brightness(1)}
  }
  .cols.animate .c{animation:cellIn .46s cubic-bezier(.22,.72,.28,1.02) both}
  .cols.animate .col:nth-child(1) .c{animation-delay:0s}
  .cols.animate .col:nth-child(2) .c{animation-delay:.022s}
  .cols.animate .col:nth-child(3) .c{animation-delay:.044s}
  .cols.animate .col:nth-child(4) .c{animation-delay:.066s}
  .cols.animate .col:nth-child(5) .c{animation-delay:.088s}
  .cols.animate .col:nth-child(6) .c{animation-delay:.11s}
  .cols.animate .col:nth-child(7) .c{animation-delay:.132s}
  .cols.animate .col:nth-child(8) .c{animation-delay:.154s}
  .cols.animate .col:nth-child(9) .c{animation-delay:.176s}
  .cols.animate .col:nth-child(10) .c{animation-delay:.198s}
  .cols.animate .col:nth-child(11) .c{animation-delay:.22s}
  .cols.animate .col:nth-child(12) .c{animation-delay:.242s}
  .cols.animate .col:nth-child(13) .c{animation-delay:.264s}
  .cols.animate .col:nth-child(14) .c{animation-delay:.286s}
  .cols.animate .col:nth-child(15) .c{animation-delay:.308s}
  .cols.animate .col:nth-child(16) .c{animation-delay:.33s}
  .cols.animate .col:nth-child(17) .c{animation-delay:.352s}
  .cols.animate .col:nth-child(18) .c{animation-delay:.374s}
  .cols.animate .col:nth-child(19) .c{animation-delay:.396s}
  .cols.animate .col:nth-child(20) .c{animation-delay:.418s}
  .cols.animate .col:nth-child(21) .c{animation-delay:.44s}
  .cols.animate .col:nth-child(22) .c{animation-delay:.462s}
  .cols.animate .col:nth-child(23) .c{animation-delay:.484s}
  .cols.animate .col:nth-child(24) .c{animation-delay:.506s}
  .cols.animate .col:nth-child(25) .c{animation-delay:.528s}
  .cols.animate .col:nth-child(26) .c{animation-delay:.55s}
  .cols.animate .col:nth-child(27) .c{animation-delay:.572s}
  .cols.animate .col:nth-child(28) .c{animation-delay:.594s}
  .cols.animate .col:nth-child(29) .c{animation-delay:.616s}
  .cols.animate .col:nth-child(30) .c{animation-delay:.638s}
  .cols.animate .col:nth-child(31) .c{animation-delay:.66s}
  .cols.animate .col:nth-child(32) .c{animation-delay:.682s}
  .cols.animate .col:nth-child(33) .c{animation-delay:.704s}
  .cols.animate .col:nth-child(34) .c{animation-delay:.726s}
  .cols.animate .col:nth-child(35) .c{animation-delay:.748s}
  .cols.animate .col:nth-child(36) .c{animation-delay:.77s}
  .cols.animate .col:nth-child(37) .c{animation-delay:.792s}
  .cols.animate .col:nth-child(38) .c{animation-delay:.814s}
  .cols.animate .col:nth-child(39) .c{animation-delay:.836s}
  .cols.animate .col:nth-child(40) .c{animation-delay:.858s}
  .cols.animate .col:nth-child(41) .c{animation-delay:.88s}
  .cols.animate .col:nth-child(42) .c{animation-delay:.902s}
  .cols.animate .col:nth-child(43) .c{animation-delay:.924s}
  .cols.animate .col:nth-child(44) .c{animation-delay:.946s}
  .cols.animate .col:nth-child(45) .c{animation-delay:.968s}
  .cols.animate .col:nth-child(46) .c{animation-delay:.99s}
  .cols.animate .col:nth-child(47) .c{animation-delay:1.012s}
  .cols.animate .col:nth-child(48) .c{animation-delay:1.034s}
  .cols.animate .col:nth-child(49) .c{animation-delay:1.056s}
  .cols.animate .col:nth-child(50) .c{animation-delay:1.078s}
  .cols.animate .col:nth-child(51) .c{animation-delay:1.1s}
  .cols.animate .col:nth-child(52) .c{animation-delay:1.122s}
  .cols.animate .col:nth-child(53) .c{animation-delay:1.144s}

  .c{transition:transform .12s ease,box-shadow .12s ease}
  .c:hover{transform:scale(1.55);box-shadow:0 0 0 1.5px var(--card),0 1px 5px rgba(0,0,0,.18);position:relative;z-index:3}
  .c:active{transform:scale(1.25)}

  @keyframes statIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .stat{animation:statIn .42s ease both}
  .stat:nth-child(1){animation-delay:.02s} .stat:nth-child(2){animation-delay:.06s}
  .stat:nth-child(3){animation-delay:.1s}  .stat:nth-child(4){animation-delay:.14s}
  .stat:nth-child(5){animation-delay:.18s} .stat:nth-child(6){animation-delay:.22s}
  .stat .v{font-variant-numeric:tabular-nums}

  @keyframes rowIn{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
  tbody tr{animation:rowIn .38s ease both}
  tbody tr:nth-child(1){animation-delay:.04s} tbody tr:nth-child(2){animation-delay:.09s}
  tbody tr:nth-child(3){animation-delay:.14s} tbody tr:nth-child(4){animation-delay:.19s}
  tbody tr:nth-child(5){animation-delay:.24s} tbody tr:nth-child(6){animation-delay:.29s}
  tbody tr:nth-child(7){animation-delay:.34s} tbody tr:nth-child(8){animation-delay:.39s}
  .bar{transform-origin:left center;animation:barIn .75s cubic-bezier(.2,.8,.25,1) both}
  @keyframes barIn{from{transform:scaleX(0);opacity:.25}to{transform:scaleX(1);opacity:.75}}

  .modes button{transition:background .18s ease,color .18s ease,transform .12s ease}
  .modes button.on{animation:pill .28s ease}
  @keyframes pill{0%{transform:scale(.93)}60%{transform:scale(1.035)}100%{transform:scale(1)}}
  @keyframes tipIn{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:.96;transform:none}}
  #tip.on{opacity:.96;animation:tipIn .13s ease}
  .card{transition:box-shadow .2s ease}

  @media (prefers-reduced-motion: reduce){
    .cols.animate .c,.stat,tbody tr,.bar,#tip.on,.modes button.on{animation:none !important}
    .c:hover{transform:none}
  }
</style>
<style>
  /* 插件内嵌：去掉独立页面的最大宽度，交给宿主容器。
     ⚠️ 背景**不能**写 transparent：iframe 自己的画布默认是白的，把 body 背景抹掉
     就等于「暗色主题 + 白底」——文字 #e8eaed、卡片是暗色玻璃，全糊在白色上
     （2026-10-04 定位到的真凶：这一行盖掉了上面的 body{background:var(--bg)}）。
     背景必须由面板自己按主题变量画，宿主是明是暗都不影响。 */
  html,body{background:var(--bg)}
  /* 画布与原生控件（滚动条）跟着主题走：此前暗色下面板里那条横向滚动条仍是白的 */
  :root{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark}
  .wrap{max-width:none;padding:2px 2px 10px}
  .loading{padding:60px 0;text-align:center;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div id="official-usage-root" class="ou-root"><div class="wrap">
  <header>
    <div>
      <h1>Token 活动</h1>
    </div>
    <div class="headRight">
      <div class="modes" id="modes">
        <button id="refresh" class="refresh" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M13.5 8a5.5 5.5 0 1 1-1.9-4.15M13.6 1.6v3.1h-3.1"/></svg>
        </button>
        <button data-m="daily" class="on">每天</button>
        <button data-m="weekly">每周</button>
        <button data-m="cumulative">累计总量</button>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="stats" id="stats"></div>
  </div>

  <div class="card gridcard">
    <div class="gridbox" id="gridbox">
      <div class="months" id="months"></div>
      <div class="gridrow">
        <div class="wd"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
        <div class="cols" id="cols"></div>
      </div>
    </div>
  </div>

  <div class="two">
    <div class="card"><h2>按 API Key</h2><div id="bykey"></div></div>
    <div class="card"><h2>按模型</h2><div id="bymodel"></div></div>
  </div>
</div>
</div>
<div id="tip"></div>
<script>
// 面板启动前的主题判定 —— 由 build-plugin.mjs 原样嵌进 <script>
// （按文件读入，不走模板字符串：正则里的 \s \d 会被 JS 转义吃掉，这个坑踩过）
//
// 优先级：
//   1. 宿主显式传的 ?theme=dark|light（客户端读 DSH 的 --dsw-alias-bg-base 后带上）
//   2. 自己顺着 frame 链往上读宿主文档（同源才行）
//   3. 系统偏好 prefers-color-scheme
//
// 同时把判定过程记进 window.__OU_DIAG__，出问题时能在控制台/诊断条里看到每一步。
(function () {
  var diag = { steps: [], chain: [], decided: null, source: 'system', param: null };

  // 支持 #rgb / #rrggbb 与 rgb()/rgba()。
  // 注意：getComputedStyle 对**自定义属性**返回的是原始写法（宿主常写 hex），
  // 只认 rgb() 会解析失败并悄悄退回系统偏好——这就是「面板白色」那次的根因。
  function lum(color) {
    var s = String(color || '').trim();
    var hex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(s);
    if (hex) {
      var v = hex[1];
      if (v.length === 3) v = v[0] + v[0] + v[1] + v[1] + v[2] + v[2];
      var r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }
    var m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(s);
    if (!m) return null;
    return (0.299 * Number(m[1]) + 0.587 * Number(m[2]) + 0.114 * Number(m[3])) / 255;
  }

  function readVar(win, name) {
    try { return String(win.getComputedStyle(win.document.documentElement).getPropertyValue(name) || '').trim(); }
    catch (e) { return null; }
  }

  // 在**宿主文档**里插一个隐藏元素，量它继承后的实际取值。
  // 自定义属性会继承，而 DSH 把设计 token 挂在 body 上，根元素上取不到。
  function sampleVar(win, name) {
    var el = null;
    try {
      var doc = win.document;
      if (!doc || !doc.body) return null;
      el = doc.createElement('div');
      el.setAttribute('aria-hidden', 'true');
      el.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;pointer-events:none;' +
        'background:var(' + name + ', transparent)';
      doc.body.appendChild(el);
      return String(win.getComputedStyle(el).backgroundColor || '').trim();
    } catch (e) {
      return null;
    } finally {
      try { if (el && el.parentNode) el.parentNode.removeChild(el) } catch (e) { /* ignore */ }
    }
  }

  // 1) 宿主参数
  try { diag.param = new URLSearchParams(location.search).get('theme'); } catch (e) { diag.param = null; }
  if (diag.param === 'dark' || diag.param === 'light') {
    diag.decided = diag.param;
    diag.source = 'param';
    diag.steps.push('用了宿主传的 ?theme=' + diag.param);
  }

  // 2) 顺着 frame 链往上读
  if (!diag.decided) {
    var w = window;
    for (var i = 0; i < 8; i++) {
      var isTop = false;
      try { isTop = (w === w.parent); } catch (e) { isTop = false; }
      if (isTop) { diag.steps.push('第 ' + i + ' 层：已经是顶层文档'); break; }
      try { w = w.parent; } catch (e) { diag.steps.push('第 ' + i + ' 层：跨源，停'); break; }

      var alive = false;
      try { alive = !!w.document && !!w.document.documentElement; } catch (e) { alive = false; }
      diag.chain.push({ level: i + 1, reachable: alive });

      if (!alive) { diag.steps.push('第 ' + (i + 1) + ' 层：读不到文档（跨源）'); continue; }

      // 先直接读根元素；DSH 的设计 token 挂在 **body** 上，根元素常常是空串，
      // 所以读不到就在那份文档里插个探针，量它**继承后的实际值**。
      var raw = readVar(w, '--dsw-alias-bg-base');
      var l = lum(raw);
      if (l === null) {
        l = lum(sampleVar(w, '--dsw-alias-bg-base'));
        if (l !== null) diag.steps.push('第 ' + (i + 1) + ' 层：根元素读不到，改用探针量继承值');
      }
      if (l === null) {
        diag.steps.push('第 ' + (i + 1) + ' 层：--dsw-alias-bg-base="' + raw + '" 且探针也量不到');
        continue;
      }
      diag.decided = l < 0.5 ? 'dark' : 'light';
      diag.source = 'ancestor@' + (i + 1);
      diag.steps.push('第 ' + (i + 1) + ' 层：亮度 ' + l.toFixed(3) + ' → ' + diag.decided);
      break;
    }
  }

  // 3) 系统偏好
  if (!diag.decided) {
    var sysDark = false;
    try { sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { /* ignore */ }
    diag.decided = sysDark ? 'dark' : 'light';
    diag.source = 'system';
    diag.steps.push('回落到系统偏好：' + (sysDark ? '暗色' : '亮色'));
  }

  document.documentElement.setAttribute('data-theme', diag.decided);
  window.__OU_THEME__ = diag;
  window.__OU_DIAG__ = diag;
})();
</script>
<script>var __OU_PLUGIN__ = true;</script>
<script>
/* 数据来源：
   · 独立文件模式 —— 上方 <script type="application/json"> 里烤好的数据
   · 插件模式    —— 宿主给 window.__OFFICIAL_USAGE_DATA__（下一行就是消费点）
   ⚠️ 插件模式下这一步绝不能碰 DOM：后面的交互绑定依赖完整 DOM，
      早期版本在这里写了一句“暂无数据”把 .wrap 换掉，直接让脚本崩在
      getElementById('modes') === null 上。 */
var __OU_PLUGIN__ = (typeof __OU_PLUGIN__ !== 'undefined');
var __OU_DATA__ = null;
if(!__OU_PLUGIN__){
  try {
    var __ouRaw = document.getElementById('payload').textContent;
    if(__ouRaw && __ouRaw.trim().charAt(0)==='{') __OU_DATA__ = JSON.parse(__ouRaw);
  } catch(e){ /* 无内嵌数据 */ }
  if(!__OU_DATA__) __OU_DATA__ = window.__OFFICIAL_USAGE_DATA__ || null;
}

const DOM = { root: document.getElementById('official-usage-root') };

// ------ 数据（插件模式下初始为 null，由宿主/自取后 bootstrap 注入） ------
let DATA = __OU_DATA__;

var LV_WEEKS = 53;

function bootstrap(data){
  DATA = data;
  byDate.clear();
  if(DATA) for(const d of DATA.days) byDate.set(d.date, d);
  cum.clear(); acc = 0;
  if(DATA) for(const d of DATA.days){ acc += d.tokens; cum.set(d.date, acc); }
  weeks = buildWeeks();
  render(); renderTables();
}

function buildWeeks(){
  if(!DATA) return [];
  /* 网格一律按 **UTC** 算，别混用本地时间。
     ① 平台的分桶时间戳是 UTC 零点（实测：tz=28800 与 tz=0 返回的时间戳一样，都是 UTC 零点），
        宿主的 dayKey 也是 UTC——所以"哪一天"这件事从头到尾就是 UTC 语义；
     ② 早先这里写的是 new Date(iso+'T00:00:00')（本地零点）再 dt.toISOString()（UTC），
        在东八区等于把每一天都退回去一天：本地 10-04 00:00 = UTC 10-03 16:00 ⇒ 取到 '2026-10-03'。
        结果就是整张表错位一行 —— 「周日」那一行显示的是周六的日期（2026-10-04 用户报的）。 */
  const lastD = new Date(DATA.window.end+'T00:00:00Z');
  const dw = (lastD.getUTCDay()+6)%7;               // 0 = 周一
  const lastMon = new Date(lastD.getTime()-dw*DAY);
  const firstMon = new Date(lastMon.getTime()-(LV_WEEKS-1)*7*DAY);
  const out=[];
  for(let w=0; w<LV_WEEKS; w++){
    const days=[];
    for(let d=0; d<7; d++){
      const dt=new Date(firstMon.getTime()+(w*7+d)*DAY);
      const iso=dt.toISOString().slice(0,10);       // UTC 记法，与宿主 dayKey 同一套
      days.push({ date:iso, dt, future: dt.getTime()>lastD.getTime(), rec: byDate.get(iso) || null });
    }
    out.push(days);
  }
  return out;
}
const DAY = 86400000;
const fmt = {  tok(n){ if(n>=1e9) return (n/1e9).toFixed(2)+'B'; if(n>=1e6) return (n/1e6).toFixed(1)+'M';
          if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); },
  tokFull(n){ return n.toLocaleString('zh-CN'); },
  /* 档位边界用的短写法：5M / 20M / 200M / 1B（整值不拖 ".0"） */
  tokShort(n){ const u = n >= 1e9 ? [1e9,'B'] : n >= 1e6 ? [1e6,'M'] : n >= 1e3 ? [1e3,'K'] : [1,''];
               const v = n / u[0]; return (Number.isInteger(v) ? v : v.toFixed(1)) + u[1]; },
  money(c){ return '¥'+c.toFixed(2); },
  date(s){ const [y,m,d]=s.split('-'); return `${y}年${+m}月${+d}日`; },
};

// ---------- 悬浮提示的三行文案（规格由用户 2026-10-04 定） ----------
/** 日期：今年只写「10月3日」，跨年才写「2025年12月3日」 */
function tipDate(iso){
  const [y,m,d] = iso.split('-');
  const thisYear = new Date().getUTCFullYear();      // 网格与日期都是 UTC 语义，年份也按 UTC 取
  return (+y === thisYear ? '' : y + '年') + (+m) + '月' + (+d) + '日';
}
/** token：≥1 亿写「亿」（2 位小数）、≥1 万写「万」（1 位小数）、再少写具体数字；数字与单位间留空格。
 *  万位本身到四位数（≥1000 万）时省掉小数，否则会出现「10000.0 万」这种读起来别扭的数。 */
function tipTokens(n){
  if(!n) return '0 token';
  if(n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿 token';
  if(n >= 1e4) {
    const w = n / 1e4;
    return (w >= 1000 ? Math.round(w).toLocaleString('zh-CN') : w.toFixed(1)) + ' 万 token';
  }
  return n.toLocaleString('zh-CN') + ' token';
}
function tipText(day, mode, week){
  const lines = [tipDate(day.date), tipTokens(day.rec ? day.rec.tokens : 0)];
  if(day.rec && day.rec.tokens) lines.push('花费 ' + day.rec.cost.toFixed(2) + ' 元');
  if(mode === 'weekly') lines.push('<b>本周 ' + tipTokens(weekTokenSum(week)) + '</b>');
  if(mode === 'cumulative') lines.push('<b>累计 ' + tipTokens(cum.get(day.date) || 0) + '</b>');
  return lines.join('<br>');
}

/* 档位边界（绝对阈值，跨月可比 —— 这是本插件的设计主张）：
     0        → 灰（当天没有用量）
     <5M / 5–20M / 20–60M / 60–120M / 120–200M / ≥200M   ← 六档绿
   边界由用户按自己的用量结构定的（2026-10-04）：他的日用量跨度约 1M–350M，
   最近 30 天落格 4/2/2/2/2/1，每档都有量。
   ⚠️ N 个边界 ⇒ N+1 个有色档：档位 = 1 + 满足的边界数。以前写成 i+1 会让顶档永远空着、
   最高的几天反而落到次高档（甚至更早那版直接返回一个不存在的 l5 → 回落成"没数据"色）。 */
const LV = [5e6, 20e6, 60e6, 120e6, 200e6];
const LV_TOP = LV.length + 1;                        // = 6，顶档
function level(v, mode){
  if(!v) return 0;
  if(mode==='cumulative'){
    // 累计是总量的量级，拿每日阈值去卡会整片顶格：按累计最大值的等分带分成六档
    const max = acc || 1, r = v / max;
    for(let i=LV.length-1;i>=0;i--) if(r >= (i+1)/(LV.length+1)) return i+2;
    return 1;
  }
  let sat = 0;
  for(let i=0;i<LV.length;i++) if(v >= LV[i]) sat++;
  return sat + 1;                                    // 1..LV_TOP
}

// build the 53-week grid (Monday first), ending this week
const byDate = DATA ? new Map(DATA.days.map(d=>[d.date,d])) : new Map();
let weeks = [];
if(DATA) weeks = buildWeeks();

// ---------- aggregation ----------
function weekTokenSum(w){ return w.reduce((a,d)=>a+(d.rec?.tokens||0),0); }
function valueFor(mode, { day, week }){
  if(mode==='daily')   return day.rec?.tokens || 0;
  if(mode==='weekly')  return weekTokenSum(week);
  return cum.get(day.date) || 0;              // cumulative: running total up to that day
}

// running cumulative (daily granularity) over the whole window
const cum = new Map(); let acc=0;
if(DATA) for(const d of DATA.days){ acc += d.tokens; cum.set(d.date, acc); }
window.__cum = cum;

const state = { mode:'daily' };

function render(){
  if(!DATA) return;
  const mode = state.mode;
  const scaleMax = mode==='cumulative' ? acc : null;

  // 月份轴：绝对定位到对应列上（左侧留出星期列 27px）
  const months = document.getElementById('months');
  const CSTEP = 17;                       // 13px 格子 + 4px 间隙
  months.innerHTML='';
  let prevM=null, lastLabelWeek=-99;
  weeks.forEach((w,i)=>{
    const m = w[0].dt.getUTCMonth();                 // 与上面同一套 UTC 语义
    // 离上一个标签不足 3 列就不标，免得挤在一起
    if(m!==prevM && i<52 && (i-lastLabelWeek)>=3){
      const s=document.createElement('span');
      s.textContent = (prevM===null ? w[0].dt.getUTCFullYear()+'年' : '') + (m+1)+'月';
      s.style.left = (i*CSTEP) + 'px';
      months.appendChild(s);
      lastLabelWeek=i;
    }
    prevM=m;
  });

  // cells
  const cols=document.getElementById('cols');
  cols.innerHTML='';
  for(const w of weeks){
    const col=document.createElement('div'); col.className='col';
    for(const d of w){
      const c=document.createElement('div'); c.className='c';
      const v=valueFor(mode,{day:d,week:w});
      if(!d.future){ c.classList.add('l'+level(v, mode)); }
      else { c.style.background='transparent'; c.style.boxShadow='inset 0 0 0 1px var(--line)'; }
      /* 悬浮提示：日视图严格三行 —— 日期 / token / 花费。
         没有用量的过去日子也给提示，就两行（日期 + 0 token）；未来的格子仍然不给提示。
         日期：今年只写「月日」，跨年才带上年份。
         token：≥1 亿写「亿」（2 位小数）、≥1 万写「万」（1 位小数）、再少就写具体数字，
               数字与单位之间留一个空格。
         周 / 累计视图下格子代表的不是单日，额外补一行说明（否则颜色含义对不上）。 */
      if(!d.future){
        c.dataset.tip='1';
        c.dataset.text = tipText(d, mode, w);
      }
      col.appendChild(c);
    }
    cols.appendChild(col);
  }

  // stats row（数字滚动动效）
  const T=DATA.totals, S=DATA.summary, B=DATA.balance;
  // 余额 = 充值 + 赠金合并成一个数（不做单独标注）；
  // 兼容两种形状：host 返回 balance{normal,bonus} / 独立文件里的 summary.normal_wallets
  const wallet = (kind) => (
    (kind==='normal' ? (B?.normal ?? S?.normal_wallets) : (B?.bonus ?? S?.bonus_wallets))?.[0]?.balance
  );
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const bal = num(wallet('normal')) + num(wallet('bonus'));
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="k">Token</div><div class="v" id="s-tok">—</div></div>
    <div class="stat"><div class="k">花费</div><div class="v" id="s-cost">—</div></div>
    <div class="stat"><div class="k">活跃天数</div><div class="v" id="s-days">—</div></div>
    <div class="stat"><div class="k">单日峰值</div><div class="v" id="s-peak">—</div></div>
    <div class="stat"><div class="k">请求次数</div><div class="v" id="s-req">—</div></div>
    <div class="stat"><div class="k">账户余额</div><div class="v" id="s-bal">—</div></div>`;
  countUp('s-tok',  T.tokens,                    v=>fmt.tok(Math.round(v)));
  countUp('s-cost', T.cost,                      v=>fmt.money(v), 2);
  countUp('s-days', T.activeDays,                v=>String(Math.round(v))+'<small>天</small>');
  countUp('s-peak', T.peakDay?.tokens||0,        v=>fmt.tok(Math.round(v))+(T.peakDay?`<small>${T.peakDay.date.slice(5)}</small>`:''));
  countUp('s-req',  T.requests,                  v=>Math.round(v).toLocaleString('zh-CN'));
  countUp('s-bal',  bal,                         v=>'¥'+v.toFixed(2), 2);

  // 重播草地生长动画（切换模式时）
  const colsEl = document.getElementById('cols');
  if(!REDUCED){
    colsEl.classList.remove('animate');
    void colsEl.offsetWidth;          // 强制重排，让 animation 重新开始
    colsEl.classList.add('animate');
  }

  // 图例按用户要求撤掉了（"神秘一点"），所以这里不再写 lgL / lgR。
  // 旧客户端手里那份 HTML 还带图例、旧脚本也还在写这两个 id —— 那是它自己的一份，互不影响。

  scrollToLatest();
}

/* 默认落在**最新（最右）**那一端：热力图是左旧右新，实际最常看的是右边。
   只在第一次画完时归位一次 —— 之后切换档位 / 点刷新都保留用户自己滚到的位置，
   免得「我在看六月，手一抖刷新就被甩回最右」。 */
let scrollPinned = false;
function scrollToLatest(){
  const g = document.getElementById('gridbox');
  if(!g || scrollPinned) return;
  scrollPinned = true;
  g.scrollLeft = g.scrollWidth;                 // 右端 = 最近几周
  // 首帧宽度可能还没算稳（字体/动画），下一帧再校一次
  requestAnimationFrame(function(){ g.scrollLeft = g.scrollWidth; });
}

// 数字滚动：从上一个显示值滚到新值
const _statVals = new Map();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(id, target, render, decimals){
  const el = document.getElementById(id); if(!el) return;
  const from = _statVals.get(id) ?? 0;
  _statVals.set(id, target);
  if(REDUCED){ el.innerHTML = render(target); return; }
  const dur = 620, t0 = performance.now();
  (function step(now){
    const p = Math.min(1,(now-t0)/dur);
    const e = 1-Math.pow(1-p,3);                    // easeOutCubic
    const v = from + (target-from)*e;
    el.innerHTML = render(decimals ? v : Math.round(v));
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

// breakdown tables
function table(rows, label){
  const max = Math.max(...rows.map(r=>r.total||r.tokens));
  return `<table><thead><tr><th>${label}</th><th class="num">Token</th><th class="num">占比</th><th class="num">活跃天</th><th></th></tr></thead><tbody>`+
    rows.map((r,i)=>{
      const t=r.total||r.tokens, pct=t/DATA.totals.tokens*100;
      return `<tr><td>${r.name||r.model}</td><td class="num">${fmt.tok(t)}</td><td class="num">${pct.toFixed(1)}%</td>`+
             `<td class="num">${r.activeDays??'—'}</td>`+
             `<td style="width:36%"><span class="bar" style="width:${Math.max(2,t/max*100)}%;animation-delay:${0.12+i*0.06}s"></span></td></tr>`;
    }).join('')+`</tbody></table>`;
}
function renderTables(){
  if(!DATA) return;
  document.getElementById('bykey').innerHTML = table(DATA.apiKeys,'API Key');
  document.getElementById('bymodel').innerHTML = table(DATA.models,'模型');
}

// interactions
document.getElementById('modes').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  // 刷新键现在也住在这个胶囊里，点它不能当成切换视图
  if(!b.dataset.m) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  state.mode=b.dataset.m; render();
});
const tip=document.getElementById('tip');

/* 悬停提示的定位：面板内嵌进宿主文档后，祖先里只要有 backdrop-filter / transform / filter
   （DSH 设置窗口 + 壁纸插件的玻璃面就是），position:fixed 的**包含块**就从视口变成那个祖先，
   于是 tip 会按祖先的内容坐标摆放、并随其滚动越偏越远，最后被 overflow 裁掉——表现就是
   「鼠标悬停格子什么也不显示」。把 tip 挂进 top layer（popover）就与祖先无关了：
   top layer 里的 fixed 永远以视口为准，也不吃祖先的裁剪。
   不支持 popover 的环境（老内核）退回原来的 fixed 行为，至少独立打开时是对的。 */
var tipTopLayer = false;
try {
  if(tip && typeof tip.showPopover === 'function'){
    tip.setAttribute('popover','manual');
    tipTopLayer = true;
  }
}catch(e){ tipTopLayer = false; }

function showTip(){
  tip.classList.add('on');
  if(!tipTopLayer) return;
  try { if(!tip.matches(':popover-open')) tip.showPopover(); } catch(e){ /* 已开或不可用：忽略 */ }
}
function hideTip(){
  tip.classList.remove('on');
  if(!tipTopLayer) return;
  try { if(tip.matches(':popover-open')) tip.hidePopover(); } catch(e){ /* ignore */ }
}

document.addEventListener('mouseover', e=>{
  const c=e.target.closest('.c[data-tip]'); if(!c) return;
  tip.innerHTML=c.dataset.text; showTip();
});
document.addEventListener('mousemove', e=>{
  if(!tip.classList.contains('on')) return;
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad;
  const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-pad;
  if(y+r.height>innerHeight-8) y=e.clientY-r.height-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest('.c[data-tip]')) hideTip();
});

// 刷新：先让宿主强刷（跳过它那份 10 分钟缓存），再取回新数据重画
// 独立文件模式下没有宿主路由，按钮仍然在，取不到就提示一下。
var REFRESH_URL = (typeof __OU_REFRESH_URL__ !== 'undefined') ? __OU_REFRESH_URL__ : '/dsh-official-usage/api/refresh';
var STATE_URL = (typeof __OU_STATE_URL__ !== 'undefined') ? __OU_STATE_URL__ : '/dsh-official-usage/api/state';
function refreshNow(){
  var btn = document.getElementById('refresh');
  if(!btn || btn.disabled) return;
  // 只有图标，所以状态挂在 title / aria-label 上，失败时按钮变红抖一下
  btn.disabled = true; btn.classList.remove('err'); btn.classList.add('busy');
  btn.title = '刷新中…'; btn.setAttribute('aria-label', '刷新中…');
  fetch(REFRESH_URL, { cache: 'no-store' })
    .then(function(){ return fetch(STATE_URL + '?fresh=1', { cache: 'no-store' }); })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.error || !d.days) throw new Error((d && d.error) || '数据为空');
      bootstrap(d);                     // 重画 + 重播草地生长动画
      btn.title = '刷新'; btn.setAttribute('aria-label', '刷新');
    })
    .catch(function(e){
      btn.classList.add('err');
      btn.title = '刷新失败：' + e.message;
      btn.setAttribute('aria-label', '刷新失败');
    })
    .finally(function(){
      setTimeout(function(){
        btn.disabled = false; btn.classList.remove('busy');
      }, 400);
    });
}
var _rb = document.getElementById('refresh');
if(_rb) _rb.addEventListener('click', refreshNow);

// 宿主用：宿主把数据交给面板（插件模式）
window.__officialUsageMount = function(payload){ if(payload) bootstrap(payload); };
window.__officialUsageSetData = function(payload){ bootstrap(payload); };
window.__officialUsageRefresh = refreshNow;

if(!__OU_PLUGIN__){
  render(); renderTables();       // 独立文件模式：数据已内嵌
}
</script>
<script>
(function(){
  // 打开面板先取一次数据（走宿主的 10 分钟缓存，毫秒级返回）；
  // 面板右上角的刷新键会带 fresh=1 强制重采。
  fetch('/dsh-official-usage/api/state', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.days || !d.days.length){ throw new Error((d && d.error) || '宿主还没取到平台用量数据'); }
      window.__OFFICIAL_USAGE_DATA__ = d;
      if(window.__officialUsageSetData) window.__officialUsageSetData(d);
      else if(window.__officialUsageMount) window.__officialUsageMount(d);
    })
    .catch(function(e){
      var w = document.querySelector('.wrap');
      if(w) w.innerHTML = '<p class="loading">取数据失败：' + e.message + '</p>';
    });
})();
</script>
</body></html>
